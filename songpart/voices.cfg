\ProvidesFile{voices.cfg}
%% ==========================

\newif\ifmultivoice
\multivoicetrue

\newcommand{\multivoiceon}{\multivoicetrue}
\newcommand{\multivoiceoff}{\multivoicefalse}

\newcommand{\rolestyle}{\textsc}
\newcommand{\secondvoicestyle}{\color{darkgray}\small}

\newcommand{\multivoice}[2]{%
  \ifmultivoice
    \leavevmode%
    \vtop{%
      \offinterlineskip%
      \hbox{\strut #1}%
      \hbox{\strut \secondvoicestyle{#2}}
    }%
  \else
    #1%
  \fi
}

\NewDocumentCommand{\role}{m g}{%
  \nobreak\hfill
  \vtop{%
    \offinterlineskip
    \IfNoValueTF{#2}{
      \hbox{\small\strut \rolestyle{#1}}%
    }{
      \hbox{\small\strut \rolestyle{#1}}%
      \ifmultivoice
        \hbox{\small\strut \rolestyle{\secondvoicestyle{#2}}}
      \else\fi
    }
  }%
}