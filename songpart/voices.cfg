\ProvidesFile{voices.cfg}
%% ==========================

\newcommand{\rolestyle}{\textsc}
\newcommand{\secondvoicestyle}{\color{darkgray}}

\newcommand{\multivoice}[2]{%
  \leavevmode%
  \vtop{%
    \offinterlineskip%
    \hbox{\strut #1}%
    \hbox{\strut \secondvoicestyle{#2}}%
  }%
}

\NewDocumentCommand{\role}{m g}{%
    \nobreak\hfill
    \vtop{%
        \offinterlineskip
        \IfNoValueTF{#2}{
            \hbox{\small\strut \rolestyle{#1}}%
        }{
            \hbox{\small\strut \rolestyle{#1}}%
            \hbox{\small\strut \rolestyle{\secondvoicestyle{#2}}}%
        }
    }%
}