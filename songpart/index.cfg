\ProvidesFile{index.cfg}

%% ==========================
%% Required packages
%% ==========================
\RequirePackage{xpatch}   % potřeba pro \xpatchcmd

% Patch the song start: 
% For the main index, add author name in parentheses after the song title
% For the author index, add song title after the author name
% This will be processed by the index building script to create grouped entries
\xpatchcmd{\SB@@@beginsong}
{\SB@addtoindexes\songtitle\SB@rawrefs\songauthors}
{\SB@addtoindexes%
    \songtitle%
    \SB@rawrefs%
    {\songauthors -->\songtitle}
}
{}{}

