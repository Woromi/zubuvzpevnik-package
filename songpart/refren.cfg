\ProvidesFile{refren.cfg}
% ==========================
% Chorus (refrén)
% ==========================
% The songs-package chorus, restyled to look like a verse with an "R:" label
% and a bigger indent (instead of the package's left-hand bar), plus
% source-capturing repeats:
%   \insertchorus   -- reprint the whole chorus
%   \insertchorus*  -- one-line reminder: the first source line, chords off,
%                      a trailing comma dropped and "..." appended
% The chorus stays the songs chorus, so the songs manual still applies.
\RequirePackage{xpatch}
\RequirePackage{xstring}

% We capture and replay the chorus ourselves, so disable the package's
% box-based repetition. Drop the left-hand chorus bar via its documented
% length (0pt = no bar; this is what the "noshading" option also does).
\norepchoruses
\setlength\cbarwidth\z@

% --- Verse-like look: an "R:" label in a wider number slot -----------------
% Bigger left indent for chorus lines.
\xpatchcmd{\justifyleft}
  {\SB@cbarshift}
  {\ifSB@inchorus\advance\leftskip1.5\versenumwidth\fi}
  {}{\PackageError{refren}{Patching \string\justifyleft\space failed}{}}

% Give the chorus a number slot...
\xpatchcmd{\beginchorus}
  {\vnumberedfalse}{\vnumberedtrue}
  {}{\PackageError{refren}{Patching \string\beginchorus\space failed}{}}

% ...and fill it with a bold "R:" instead of a verse number.
\xpatchcmd{\SB@@beginchorus}
{
	\setbox\SB@box\vbox\bgroup\begingroup%
	\ifchorded%
		\def\SB@everypar{%
			\vrule\@height\baselineskip\@width\z@\@depth\z@%
			\gdef\SB@everypar{}%
		}%
		\everypar{\SB@everypar\everypar{}}%
	\fi%
}
{
	\setbox\SB@box\vbox\bgroup\begingroup
	\ifvnumbered
		\def\SB@everypar{%
			\setbox\SB@box\hbox{\bfseries{R:}}%
			\ifdim\wd\SB@box<\versenumwidth
				\setbox\SB@box
				\hbox to1.5\versenumwidth{\unhbox\SB@box\hfil}%
			\fi
			\ifchorded\vrule\@height\baselineskip\@width\z@\@depth\z@\fi
			\placeversenum\SB@box
			\gdef\SB@everypar{}%
		}
	\else
		\def\SB@everypar{
			\ifchorded\vrule\@height\baselineskip\@width\z@\@depth\z@\fi
			\gdef\SB@everypar{}
		}
	\fi
	\everypar{\SB@everypar\everypar{}}
}
{}{\PackageError{refren}{Patching \string\SB@@beginchorus\space failed}{}}

% --- Source-capturing chorus + repeats -------------------------------------
% Keep the (now patched) songs chorus to typeset with.
\let\zub@chorus@begin\beginchorus
\let\zub@chorus@end\endchorus
\let\zub@chorusstr\@empty       % whole chorus, as a re-scannable string
\let\zub@chorusfirststr\@empty  % its first source line

% \beginchorus captures its body up to \endchorus as a re-scannable string
% (source line breaks kept as CR; '#' kept as a plain char so sharps survive),
% then replays it through the real songs chorus with \scantokens -- re-reading
% it as input so the songs chord reader runs again (sharps and the rest render
% normally). \endchorus stays the songs macro / grab delimiter.
\def\beginchorus{%
  \begingroup
  \catcode`\^^M\active%
  \endlinechar=13\relax        % songs sets \endlinechar=-1; restore it so line
                               % ends emit CR tokens we can capture
  \catcode`\#=12\relax         % '#' as a plain char: storable + clean detokenize
  \zub@chorus@grab
}
\long\def\zub@chorus@grab#1\endchorus{%
  \xdef\zub@chorusstr{\detokenize{#1}}%
  \endgroup
  \zub@chorus@extractfirst
  \zub@chorus@show\zub@chorusstr
}

% First source line of the captured chorus. CR (^^M) is catcode 12 here, to
% match the detokenized line breaks; the empty leading segments produced by the
% \beginchorus-line newline are skipped. Every line is %-terminated so the
% catcode-12 newlines are not emitted as text.
\begingroup
\catcode`\^^M=12\relax%
\gdef\zub@chorus@extractfirst{%
\expandafter\zub@chorus@splitfirst\zub@chorusstr^^M\zub@stop%
}%
\gdef\zub@chorus@splitfirst#1^^M#2\zub@stop{%
\edef\zub@chorus@seg{#1}%
\ifx\zub@chorus@seg\@empty%
\def\zub@chorus@next{\zub@chorus@splitfirst#2\zub@stop}%
\else%
\let\zub@chorusfirststr\zub@chorus@seg%
\let\zub@chorus@next\relax%
\fi%
\zub@chorus@next%
}%
\endgroup

% Replay a captured string through the real chorus.
\newcommand\zub@chorus@show[1]{%
  \zub@chorus@begin
    \expandafter\scantokens\expandafter{#1}%
  \zub@chorus@end
}

% \insertchorus = full reprint; \insertchorus* = one-line reminder.
\newcommand\insertchorus{\@ifstar\zub@chorus@short\zub@chorus@full}

\newcommand\zub@chorus@full{%
  \ifx\zub@chorusstr\@empty
    \PackageWarning{refren}{No chorus captured yet for \string\insertchorus}%
  \else
    \zub@chorus@show\zub@chorusstr
  \fi
}

\newcommand\zub@chorus@short{%
  \ifx\zub@chorusfirststr\@empty
    \PackageWarning{refren}{No chorus captured yet for \string\insertchorus*}%
  \else
    \edef\zub@chorus@line{\zub@chorusfirststr}%
    \IfEndWith{\zub@chorus@line}{,}%
      {\StrGobbleRight{\zub@chorus@line}{1}[\zub@chorus@line]}{}%
    \edef\zub@chorus@line{\zub@chorus@line...}%
    \zub@chorus@begin
      \chordsoff
      \expandafter\scantokens\expandafter{\zub@chorus@line}%
    \zub@chorus@end
  \fi
}
\endinput
