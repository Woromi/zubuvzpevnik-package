\ProvidesFile{refren.cfg}
% ==========================
% Chorus (refrén)
% ==========================
% The songs chorus restyled as a verse with an "R:" label, plus \insertchorus
% and \insertchorus*. It stays the songs chorus, so that manual still applies.
% How the capture works: docs/internals.md#the-chorus-refrencfg
\RequirePackage{xpatch}

% We replay the chorus from source, so drop the package's box repetition and bar.
\norepchoruses
\setlength\cbarwidth\z@

% --- Verse-like look: an "R:" label in a wider number slot -----------------
% Bigger left indent for chorus lines.
\xpatchcmd{\justifyleft}
  {\SB@cbarshift}
  {\ifSB@inchorus\advance\leftskip1.5\versenumwidth\fi}
  {}{\PackageError{refren}{Patching \string\justifyleft\space failed}{}}

% Give the chorus a number slot...
\xpatchcmd{\beginchorus}
  {\vnumberedfalse}{\vnumberedtrue}
  {}{\PackageError{refren}{Patching \string\beginchorus\space failed}{}}

% ...and fill it with a bold "R:" instead of a verse number.
\xpatchcmd{\SB@@beginchorus}
{
	\setbox\SB@box\vbox\bgroup\begingroup%
	\ifchorded%
		\def\SB@everypar{%
			\vrule\@height\baselineskip\@width\z@\@depth\z@%
			\gdef\SB@everypar{}%
		}%
		\everypar{\SB@everypar\everypar{}}%
	\fi%
}
{
	\setbox\SB@box\vbox\bgroup\begingroup
	\ifvnumbered
		\def\SB@everypar{%
			\setbox\SB@box\hbox{\bfseries{R\zub@chorus@label:}}%
			\ifdim\wd\SB@box<\versenumwidth
				\setbox\SB@box
				\hbox to1.5\versenumwidth{\unhbox\SB@box\hfil}%
			\fi
			\ifchorded\vrule\@height\baselineskip\@width\z@\@depth\z@\fi
			\placeversenum\SB@box
			\gdef\SB@everypar{}%
		}
	\else
		\def\SB@everypar{
			\ifchorded\vrule\@height\baselineskip\@width\z@\@depth\z@\fi
			\gdef\SB@everypar{}
		}
	\fi
	\everypar{\SB@everypar\everypar{}}
}
{}{\PackageError{refren}{Patching \string\SB@@beginchorus\space failed}{}}

% --- Source-capturing chorus + repeats -------------------------------------
% Keep the (now patched) songs chorus to typeset with.
\let\zub@chorus@begin\beginchorus
\let\zub@chorus@end\endchorus
\let\zub@chorusstr\@empty       % whole chorus, as a re-scannable string
\let\zub@chorusnum\@empty       % its number ([2] in \beginchorus[2]), or none
\let\zub@chorus@label\@empty    % the number the "R:" label shows while typesetting

% A song starts with no chorus to repeat -- the last song's must not leak in.
% Numbered choruses are kept per song (\zub@chorus@slot), so need no clearing.
\g@addto@macro\SB@@@beginsong{%
  \global\let\zub@chorusstr\@empty
  \global\let\zub@chorusnum\@empty
}
% Where chorus #1 of the current song is stored; songs' songnum is the song's own.
\newcommand\zub@chorus@slot[1]{zub@chorus@\the\c@songnum @#1}

% Grab the body, store it detokenized, replay it through the real chorus with
% \scantokens so the songs chord reader runs again. Both spellings work but need
% different delimiters, so \chorus flags the environment form for \beginchorus.
\newcommand\zub@chorusenv{0}
\def\chorus{\gdef\zub@chorusenv{1}\beginchorus}
% \beginchorus[2] numbers the chorus: labelled "R2:", repeated by \insertchorus[2].
% The bracket is read before the grab switches catcodes.
\def\beginchorus{\@ifnextchar[\zub@chorus@numbered{\zub@chorus@numbered[]}}
\def\zub@chorus@numbered[#1]{%
  \xdef\zub@chorusnum{#1}%
  \zub@chorus@grabstart
}
\def\zub@chorus@grabstart{%
  \begingroup
  \catcode`\^^M\active%
  \endlinechar=13\relax        % songs sets -1; restore so line ends emit CR
  \catcode`\#=12\relax         % '#' as a plain char: storable + clean detokenize
  \if1\zub@chorusenv
    \gdef\zub@chorusenv{0}%
    \expandafter\zub@chorus@grabenv
  \else
    \expandafter\zub@chorus@grab
  \fi
}
\long\def\zub@chorus@grab#1\endchorus{%
  \zub@chorus@capture{#1}%
  \zub@chorus@show\zub@chorusnum{}\zub@chorusstr
}
% The swallowed \end{chorus} is handed back, so LaTeX still closes chorus and group.
\def\zub@chorus@chorusname{chorus}
\long\def\zub@chorus@grabenv#1\end#2{%
  \def\zub@chorus@envname{#2}%
  \ifx\zub@chorus@envname\zub@chorus@chorusname
    \zub@chorus@capture{#1}%
    \zub@chorus@replay\zub@chorusnum{}\zub@chorusstr
    \end{#2}%
  \else
    \endgroup
    \PackageError{refren}{Expected \string\end{chorus}, found \string\end{#2}}%
      {A \string\begin{chorus} must be closed by \string\end{chorus}, and cannot
       contain another environment.\MessageBreak
       Write the chorus as \string\beginchorus\space…\space\string\endchorus\space
       if you need to nest one inside it.}%
  \fi
}
\long\def\zub@chorus@capture#1{%
  \xdef\zub@chorusstr{\detokenize{#1}}%
  \endgroup
  \ifx\zub@chorusnum\@empty\else
    \expandafter\global\expandafter\let
      \csname\zub@chorus@slot\zub@chorusnum\endcsname\zub@chorusstr
  \fi
}

% \insertchorus* builds its one-line reminder in Lua (lua/refren.lua).
\zub@loadlua{refren}

% \zub@chorus@replay{number}{setup}{string} leaves the chorus open, for
% \end{chorus} to close; the label shows the number until the chorus ends.
\newcommand\zub@chorus@replay[3]{%
  \xdef\zub@chorus@label{#1}%
  \zub@chorus@begin
    #2%
    \expandafter\scantokens\expandafter{#3}%
}
\newcommand\zub@chorus@show[3]{%
  \zub@chorus@replay{#1}{#2}{#3}\zub@chorus@end
  \global\let\zub@chorus@label\@empty
}

% \insertchorus = full reprint; \insertchorus* = one-line reminder. Either takes
% [n] for chorus n (empty: the song's most recent chorus), then [setup] run
% inside the repeat before its text: \insertchorus[][\chordsoff].
\newcommand\insertchorus{\@ifstar
  {\zub@chorus@which\zub@chorus@short}{\zub@chorus@which\zub@chorus@full}}
\def\zub@chorus@which#1{\@ifnextchar[{\zub@chorus@which@#1}{#1[]{}}}
\def\zub@chorus@which@#1[#2]{%
  \@ifnextchar[{\zub@chorus@which@@#1{#2}}{#1[#2]{}}}
\def\zub@chorus@which@@#1#2[#3]{#1[#2]{#3}}
% Points \zub@chorus@pick@str/@num at chorus #1, or at the latest one.
\newcommand\zub@chorus@pick[1]{%
  \def\zub@chorus@pick@num{#1}%
  \ifx\zub@chorus@pick@num\@empty
    \let\zub@chorus@pick@num\zub@chorusnum
    \let\zub@chorus@pick@str\zub@chorusstr
  \else
    \expandafter\let\expandafter\zub@chorus@pick@str
      \csname\zub@chorus@slot{#1}\endcsname
    \ifx\zub@chorus@pick@str\relax\let\zub@chorus@pick@str\@empty\fi
  \fi
}
\def\zub@chorus@missing#1{%
  \PackageWarning{refren}{No chorus\ifx\zub@chorus@pick@num\@empty\else\space
    \zub@chorus@pick@num\fi\space captured yet in this song for \detokenize{#1}}%
}

\long\def\zub@chorus@full[#1]#2{%
  \zub@chorus@pick{#1}%
  \ifx\zub@chorus@pick@str\@empty
    \zub@chorus@missing{\insertchorus}
  \else
    \zub@chorus@show\zub@chorus@pick@num{#2}\zub@chorus@pick@str
  \fi
}

% The reminder is chords and second voice off, so [\chordson] can bring them back.
% Right after \insertchorus*, a \[chord] leads the line in place of its own
% chords, and then a \rep{n} joins it after the dots.
\long\def\zub@chorus@short[#1]#2{\zub@short@tail\zub@chorus@shortdo{#1}{#2}}
% \zub@short@tail\do{n}{setup} reads the optional \[chord] and \rep{n} for \do.
\long\def\zub@short@tail#1#2#3{%
  \@ifnextchar\[{\zub@short@lead{#1}{#2}{#3}}{\zub@short@rep{#1}{#2}{#3}{}}}
\long\def\zub@short@lead#1#2#3\[#4]{\zub@short@rep{#1}{#2}{#3}{\[#4]}}
\long\def\zub@short@rep#1#2#3#4{%
  \@ifnextchar\rep{\zub@short@repa{#1}{#2}{#3}{#4}}{#1{#2}{#3}{#4}{}}}
\long\def\zub@short@repa#1#2#3#4\rep#5{#1{#2}{#3}{#4}{\rep{#5}}}
% The reminder's Lua call and its setup: with a lead chord the chords stay as
% they are, so a book without chords still has none.
\long\def\zub@short@line#1#2#3{%
  \edef\zub@short@str{%
    \directlua{zubchorus.reminder("\luaescapestring{#1}",
      "\luaescapestring{\detokenize{#3}}", "\luaescapestring{\detokenize{#2}}")}}%
  \if\relax\detokenize{#2}\relax
    \def\zub@short@setup{\chordsoff\multivoiceoff}%
  \else
    \def\zub@short@setup{\multivoiceoff}%
  \fi
}
\long\def\zub@chorus@shortdo#1#2#3#4{%
  \zub@chorus@pick{#1}%
  \expandafter\zub@short@line\expandafter{\zub@chorus@pick@str}{#3}{#4}%
  \ifx\zub@short@str\@empty
    \zub@chorus@missing{\insertchorus*}
  \else
    \zub@chorus@show\zub@chorus@pick@num{\zub@short@setup#2}\zub@short@str
  \fi
}
\endinput
