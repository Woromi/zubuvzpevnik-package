\ProvidesFile{refren.cfg}

% Nastaveni stylu refrenu
\xpatchcmd{\justifyleft}
{\SB@cbarshift}
{\ifSB@inchorus\advance\leftskip1.5\versenumwidth\fi}
{}{}

\xpatchcmd{\justifycenter}
{\SB@cbarshift}{}
{}{}

\xpatchcmd{\SB@par}
{\ifdim\cbarwidth>\z@\nobreak\else\SB@ilpenalty\fi}{}
{}{}

\xpatchcmd{\brk}
{
	\ifdim\cbarwidth=\z@%
	\ifrepchorus\marks\SB@cmarkclass{}\fi%
	\SB@breakpoint\brkpenalty%
}
{
	\endgroup\egroup
	\ifrepchorus\ifSB@gotchorus\else
		\global\setbox\SB@chorusbox\vbox{
			\unvbox\SB@chorusbox
			\SB@chorusbar\SB@box
			\unvcopy\SB@box
			\SB@breakpoint\brkpenalty
		}%
	\fi
}
{}{}

\xpatchcmd{\beginchorus}
{\vnumberedfalse}{\vnumberedtrue}
{}{}

\xpatchcmd{\SB@@beginchorus}
{
	\setbox\SB@box\vbox\bgroup\begingroup%
	\ifchorded%
		\def\SB@everypar{%
			\vrule\@height\baselineskip\@width\z@\@depth\z@%
			\gdef\SB@everypar{}%
		}%
		\everypar{\SB@everypar\everypar{}}%
	\fi%
}
{
	\setbox\SB@box\vbox\bgroup\begingroup
	\ifvnumbered
		\def\SB@everypar{%
			\setbox\SB@box\hbox{\bfseries{R:}}%
			\ifdim\wd\SB@box<\versenumwidth
				\setbox\SB@box
				\hbox to1.5\versenumwidth{\unhbox\SB@box\hfil}%
			\fi
			\ifchorded\vrule\@height\baselineskip\@width\z@\@depth\z@\fi
			\placeversenum\SB@box
			\gdef\SB@everypar{}%
		}
	\else
		\def\SB@everypar{
			\ifchorded\vrule\@height\baselineskip\@width\z@\@depth\z@\fi
			\gdef\SB@everypar{}
		}
	\fi
	\everypar{\SB@everypar\everypar{}}
}
{}{}

\xpatchcmd{\SB@endchorus}
{\SB@chorusbar\SB@box}{}
{}{}

\newcommand{\insertchorus}{%
	\ifvoid\SB@chorusbox % Check if a chorus has been defined
		\PackageWarning{zubuvzpevnik}{No chorus defined yet for \string\insertchorus}
	\else
		\beginchorus
		\unvbox\SB@chorusbox % Output the stored chorus
		\endchorus
	\fi
}

