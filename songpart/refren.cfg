%% command to replay chorus
%\newcommand{\repeatchorus}{\usebox{\zub@chorusbox}}

\let\savechoruscontent\@empty % Initialize an empty macro to store chorus
\newenvironment{storechorus}{%
	\begingroup
	\let\oldchorus\beginchorus % Save original chorus environment
	\let\oldendchorus\endchorus
	\def\beginchorus{%
		\oldchorus
		\let\savechoruscontent\relax % Clear previous content
		\obeylines % Preserve line breaks
		\let\save@line\@gobble % Helper to capture lines
		\def\\{\save@line\cr}% Redefine \\ to save lines
		\def\save@line##1\cr{%
			\ifx\savechoruscontent\relax
			\def\savechoruscontent{##1}% Store first line
			\def\savefirstline{##1}% Store first line separately
			\else
			\expandafter\def\expandafter\savechoruscontent\expandafter{\savechoruscontent\cr##1}% Append subsequent lines
			\fi
			##1\cr % Print the line
		}%
	}%
}{%
	\endchorus
	\endgroup
}

% Command to reprint the full chorus
\newcommand{\reprintchorus}{%
	\beginchorus
	\savechoruscontent
	\endchorus
}

% Command to print the first line of the chorus followed by ...
\newcommand{\shortchorus}{%
	\beginchorus
	\savefirstline\ldots
	\endchorus
}