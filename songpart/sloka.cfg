\ProvidesFile{sloka.cfg}

% ==========================
% Required packages
% ==========================
\RequirePackage{xparse}
\RequirePackage{xpatch}

% ==========================
% Bold verse numbers
% ==========================
\renewcommand{\theversenum}{\bfseries\versenumstyle{versenum}}

% ==========================
% Define a new custom song part type based on a verse
% ==========================
\NewDocumentCommand{\newSongPartType}{m m m}{%	
	% Create \beginpartname command
	\expandafter\NewDocumentCommand\csname begin#1\endcsname{}{%
		\begingroup
		\renewcommand{\theversenum}{\bfseries{#2}}%
		\renewcommand{\versenumwidth}{#3em}%
		\beginverse%
	}%
	
	% Create \endpartname command  
	\expandafter\NewDocumentCommand\csname end#1\endcsname{}{%
		\endverse%
		\endgroup
	}%
}

% Usage: \newSongPartType{name}{label}{indentmultiplier}

% ==========================
% Common songparts definition
% ==========================
\newSongPartType{bridge}{*}{3}
