\ProvidesFile{sloka.cfg}
% Verse, the part core, \newSongPartType. Rationale: docs/internals.md#song-parts

% ==========================
% Required packages
% ==========================
\RequirePackage{xparse}
\RequirePackage{xpatch}

% ==========================
% Bold verse numbers
% ==========================
\renewcommand{\theversenum}{{\bfseries\versenumstyle{versenum}}}

% ==========================
% Per-part chord memory  (each part type gets its own register; "verse" = default)
% ==========================
\newcommand{\zub@partnames}{}

% Declare part <name>'s register once.
\newcommand{\zub@newpartchords}[1]{%
	\@ifundefined{SB@cr@#1}{%
		\newchords{#1}%
		\ifx\zub@partnames\@empty
			\def\zub@partnames{#1}%
		\else
			\g@addto@macro\zub@partnames{,#1}%
		\fi
	}{}%
}

% Empty every named register at each \beginsong (songs resets only the default).
\newcommand{\zub@resetpartchords}{%
	\@for\zub@tmp:=\zub@partnames\do{%
		\global\csname SB@cr@\zub@tmp\endcsname{\\}%
	}%
}
\g@addto@macro\SB@@@beginsong{\zub@resetpartchords}

% Redirect the current verse's chord memory to part <name>'s register.
\newcommand{\zub@partchords}[1]{%
	\expandafter\SB@ifempty\csname SB@cr@#1\endcsname
		{\memorize[#1]}{\replay[#1]}%
}

% Current part (empty in a plain verse); set by \zub@beginpart.
\newcommand{\zub@currentpart}{}

% Bare \memorize targets the current part's register (\memorize[name] unchanged).
\renewcommand{\memorize}{\@ifnextchar[\SB@memorize{\SB@memorize[\zub@currentpart]}}

% "verse" names the default register for \usechords / \copychords.
\expandafter\let\csname SB@cr@verse\endcsname\SB@cr@

% Used INSIDE a part: \usechords replays src here only, \copychords also for later same-type parts.
\newcommand{\usechords}[1]{\replay[#1]}
\newcommand{\copychords}[1]{%
	\expandafter\let\expandafter\zub@cc@to\csname SB@cr@\zub@currentpart\endcsname
	\expandafter\let\expandafter\zub@cc@from\csname SB@cr@#1\endcsname
	\global\zub@cc@to\expandafter{\the\zub@cc@from}%
	\replay[\zub@currentpart]%
}

% ==========================
% Verse-based song-part core
% ==========================
% \zub@beginpart{name}{label}{indentEm}{setup}: a verse with its number rolled
% back; empty label = no marker. setup = extra body code.
\NewDocumentCommand{\zub@beginpart}{m m m m}{%
	\begingroup
	\renewcommand{\theversenum}{\bfseries{#2}}%
	\renewcommand{\versenumwidth}{#3em}%
	\let\zub@versedot\@empty%
	\beginverse\addtocounter{versenum}{-1}%
	\renewcommand{\zub@currentpart}{#1}%
	\zub@partchords{#1}%
	#4%
}
\newcommand{\zub@endpart}{%
	\endverse%
	\endgroup
}

% ==========================
% Define a new custom song part type based on a verse
% ==========================
% \newSongPartType[setup]{name}{label}{indentmult}: defines both \beginX...\endX
% and \begin{X}...\end{X}, as the songs package does for verse.
% Starred: numbered and reprintable like the chorus; see docs/internals.md#repeatable-parts.
\NewDocumentCommand{\newSongPartType}{s O{} m m m}{%
	\zub@newpartchords{#3}%
	\IfBooleanTF{#1}{\zub@rp@define{#3}{#4}{#5}{#2}}{%
		\expandafter\NewDocumentCommand\csname begin#3\endcsname{}{\zub@beginpart{#3}{#4}{#5}{#2}}%
		\newenvironment{#3}{\csname begin#3\endcsname}{\zub@endpart}%
	}%
}

% ==========================
% Repeatable parts (\newSongPartType*): the chorus capture, for a verse-based part
% ==========================
% Part being replayed from captured source (empty otherwise); the checkpaper probe reads it.
\let\zub@replaying\@empty
\let\zub@rp@name\@empty
\let\zub@rp@num\@empty

% \zub@rp@define{name}{letter}{indent}{setup}: \beginX[n]...\endX, \insertX[n][setup], \insertX*.
\newcommand{\zub@rp@define}[4]{%
	\expandafter\def\csname zub@rp@label@#1\endcsname{#2}%
	\expandafter\def\csname zub@rp@indent@#1\endcsname{#3}%
	\expandafter\def\csname zub@rp@setup@#1\endcsname{#4}%
	\expandafter\def\csname begin#1\endcsname{\zub@rp@begin{#1}}%
	\expandafter\zub@rp@defgrab\csname zub@rp@grab@#1\expandafter\endcsname\csname end#1\endcsname
	\expandafter\def\csname end#1\endcsname{%
		\PackageError{zubuvzpevnik}{\expandafter\string\csname end#1\endcsname\space without
			\expandafter\string\csname begin#1\endcsname}{}}%
	\expandafter\def\csname #1\endcsname{%
		\PackageError{zubuvzpevnik}{Write \expandafter\string\csname begin#1\endcsname
			\space...\space\expandafter\string\csname end#1\endcsname,
			not \string\begin{#1}}{A repeatable part is captured up to that token.}}%
	\expandafter\def\csname insert#1\endcsname{\gdef\zub@rp@name{#1}%
		\@ifstar{\zub@chorus@which\zub@rp@short}{\zub@chorus@which\zub@rp@full}}%
}
\def\zub@rp@defgrab#1#2{\long\def#1##1#2{\zub@rp@capture{##1}}}

% The bracket is read before the grab switches catcodes, as for \beginchorus[n].
\def\zub@rp@begin#1{%
	\gdef\zub@rp@name{#1}%
	\@ifnextchar[\zub@rp@numbered{\zub@rp@numbered[]}%
}
\def\zub@rp@numbered[#1]{%
	\xdef\zub@rp@num{#1}%
	\begingroup
	\catcode`\^^M\active
	\endlinechar=13\relax
	\catcode`\#=12\relax
	\csname zub@rp@grab@\zub@rp@name\endcsname
}

% Slots are keyed by song number, so nothing leaks between songs.
\newcommand\zub@rp@slot[1]{zub@rp@\zub@rp@name @\the\c@songnum @#1}
\long\def\zub@rp@capture#1{%
	\xdef\zub@rp@str{\detokenize{#1}}%
	\endgroup
	\expandafter\global\expandafter\let\csname\zub@rp@slot{last}\endcsname\zub@rp@str
	\expandafter\global\expandafter\let\csname\zub@rp@slot{lastnum}\endcsname\zub@rp@num
	\ifx\zub@rp@num\@empty\else
		\expandafter\global\expandafter\let\csname\zub@rp@slot{=\zub@rp@num}\endcsname\zub@rp@str
	\fi
	\zub@rp@show\zub@rp@name\zub@rp@num{}\zub@rp@str
}

% \zub@rp@show{name}{number}{setup}{string}: the label shows the number.
\newcommand\zub@rp@show[4]{%
	\xdef\zub@replaying{#1}%
	\edef\zub@rp@tmp{\noexpand\zub@beginpart{#1}%
		{\csname zub@rp@label@#1\endcsname#2:}{\csname zub@rp@indent@#1\endcsname}}%
	\zub@rp@tmp{\csname zub@rp@setup@#1\endcsname#3}%
	\expandafter\scantokens\expandafter{#4}%
	\zub@endpart
	\global\let\zub@replaying\@empty
}

% Points \zub@rp@pick@str/@num at part #1 of the current type, or the latest one.
\newcommand\zub@rp@pick[1]{%
	\def\zub@rp@pick@num{#1}%
	\ifx\zub@rp@pick@num\@empty
		\expandafter\let\expandafter\zub@rp@pick@num\csname\zub@rp@slot{lastnum}\endcsname
		\expandafter\let\expandafter\zub@rp@pick@str\csname\zub@rp@slot{last}\endcsname
	\else
		\expandafter\let\expandafter\zub@rp@pick@str\csname\zub@rp@slot{=#1}\endcsname
	\fi
	\ifx\zub@rp@pick@str\relax\let\zub@rp@pick@str\@empty\fi
	\ifx\zub@rp@pick@num\relax\let\zub@rp@pick@num\@empty\fi
}
\def\zub@rp@missing{%
	\PackageWarning{zubuvzpevnik}{No \zub@rp@name\ifx\zub@rp@pick@num\@empty\else
		\space\zub@rp@pick@num\fi\space captured yet in this song to insert}%
}
\long\def\zub@rp@full[#1]#2{%
	\zub@rp@pick{#1}%
	\ifx\zub@rp@pick@str\@empty
		\zub@rp@missing
	\else
		\zub@rp@show\zub@rp@name\zub@rp@pick@num{#2}\zub@rp@pick@str
	\fi
}
% The reminder line is built by the chorus's Lua (lua/refren.lua).
\long\def\zub@rp@short[#1]#2{%
	\@ifnextchar\rep{\zub@rp@shortrep{#1}{#2}}{\zub@rp@shortdo{#1}{#2}{}}%
}
\long\def\zub@rp@shortrep#1#2\rep#3{\zub@rp@shortdo{#1}{#2}{\rep{#3}}}
\long\def\zub@rp@shortdo#1#2#3{%
	\zub@rp@pick{#1}%
	\edef\zub@rp@line{%
		\directlua{zubchorus.reminder("\luaescapestring{\zub@rp@pick@str}",
			"\luaescapestring{\detokenize{#3}}")}}%
	\ifx\zub@rp@line\@empty
		\zub@rp@missing
	\else
		\zub@rp@show\zub@rp@name\zub@rp@pick@num{\chordsoff\multivoiceoff#2}\zub@rp@line
	\fi
}

% ==========================
% Common songparts definition
% ==========================
\newSongPartType{bridge}{*}{3}
\newSongPartType{intro}{}{0}
\newSongPartType{interlude}{}{0}
\newSongPartType{outro}{}{0}
\newSongPartType*{prechorus}{P}{3}

% ==========================
% Print the label, then a dot only after a verse number
% ==========================
% The dot is the ordinal of "1."; a part's label (P:, *, A:) is printed as
% written, which \zub@beginpart arranges by emptying \zub@versedot.
\newcommand{\zub@versedot}{.}
% No \lyricfont here: the verse's own font is already in force, and \lyricfont
% carries the A5 body size, so re-applying it pins the number and it stops
% following a song's \smalleronsmallpage. The R: label does the same and is why
% it tracked correctly. See docs/internals.md#the-a5-body-size.
\renewcommand{\printversenum}[1]{%
	\setbox0=\hbox{#1}%
	\ifdim\wd0>0pt%
		{#1\zub@versedot\quad}%
	\else\fi
}

\endinput
