\ProvidesFile{instrumental.cfg}
% The reusable chords-only part style (\chordsonly) and the built-in
% instrumental part. See README.md in this directory.

\newcommand{\zub@chordwidth}{2em}
\newcommand{\setchordwidth}[1]{\renewcommand{\zub@chordwidth}{#1}}

% \chordsonly: a part-body style — chords only, on the baseline, each in a
% fixed-width box (so chord-only passages align). Pass it as the \newSongPartType
% setup to make ANY part type chords-only, e.g. an own solo part:
%   \newSongPartType[\chordsonly]{solo}{}{0}
\newcommand{\chordsonly}{%
	\nolyrics% Move chords to baseline only
	\setlength{\parindent}{0pt}%
	\setlength{\leftskip}{0pt}%
	\setlength{\rightskip}{0pt}%
	\let\oldprintchord\printchord
	\renewcommand\printchord[1]{\makebox[\zub@chordwidth][l]{\oldprintchord{##1}}}%
	\let\oldmbar\SB@mbar
	\renewcommand\SB@mbar[2]{\makebox[0.5em][c]{\oldmbar{##1}{##2}}}%
	\renewcommand\baselinestretch{1}% Minimize vertical spacing
	\lineskiplimit=-\maxdimen\lineskip=0pt% Extra control over vertical spacing
	\setlength{\baselineskip}{\f@size\p@}% match font size
}

% Built-in instrumental: an unnumbered chords-only part, used as
% \begininstrumental … \endinstrumental like every other part.
\newSongPartType[\chordsonly]{instrumental}{}{0}
