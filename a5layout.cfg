\ProvidesFile{a5layout.cfg}
% ==========================
% The A5 body, shared by every A5 class
% ==========================
% This is the text block each song's pap={...,a5} was measured against. Change
% anything here and every A5 mark in the database is stale -- re-measure with
% scripts/checkpaper.py --measure a5. See docs/internals.md.
% Load from a class that took a5paper at 10pt, after \RequirePackage{zubuvzpevnik}.
\ifdim\paperwidth=148mm\relax\else
	\PackageWarning{a5layout}{Loaded on \the\paperwidth\space by
		\the\paperheight, not A5, so the pap={a5} measurements do not apply}%
\fi

% ==========================
% Page layout
% ==========================
\RequirePackage[
	tmargin=1.5cm,
	bmargin=1.5cm,
	lmargin=1cm,
	rmargin=1cm
]{geometry}

% ==========================
% Song styling overrides
% ==========================
% 9pt body (one size below the class's 10pt), so a song needing more asks with
% \smalleronsmallpage (8pt) instead of the book carrying three sizes.
% \small, not \smaller[0.5]: this is applied again inside \printversenum, and a
% relative size would compound there. See docs/internals.md#the-a5-body-size.
\renewcommand{\zub@lyricfont}{\small\ttfamily}
\renewcommand{\zub@printchord}{\ttfamily\bfseries}
\renewcommand{\zub@stitlefont}{\Huge}

% ==========================
% Paragraph & spacing
% ==========================
\setlength{\parindent}{0pt} % No indent for song lines
\setlength{\parskip}{6pt} % Space between stanzas
\RequirePackage{setspace}
\onehalfspacing % Slightly spaced lines for readability

\multivoiceoff

\endinput
