\ProvidesFile{obsah.cfg}
% ==========================
% Obsah: index registration + formatting
% ==========================
% Title index (obsah) + author index (obsahAutor); see docs/internals.md.
\newindex{obsah}{obsah}
\indexsongsas{obsah}{\thepage}
\newauthorindex{obsahAutor}{obsahAutor}
\indexsongsas{obsahAutor}{\thepage}

%% ==========================
%% Required packages
%% ==========================
\RequirePackage{xpatch}   % potřeba pro \xpatchcmd

% Patch addtoindexes to add author --> song title entries
\xpatchcmd{\SB@@@beginsong}
{\SB@addtoindexes\songtitle\SB@rawrefs\songauthors}
{\SB@addtoindexes%
    \songtitle%
    \SB@rawrefs%
    {\songauthors -->\songtitle}
}
{}{\PackageError{zubuvzpevnik}{Patching \string\SB@@@beginsong\space (author
	index entries) failed}{}}

% Make the index headings smaller than default
\renewcommand\idxheadfont{\sffamily\bfseries\Large}

% Patch author index to always behave as a large index (with section headings)
\xpatchcmd{\SB@makeauthorindex}
{\renewenvironment{SB@smidx}[1]{}{}} % Co hledáme
{\renewenvironment{SB@smidx}[1]{\begin{SB@lgidx}{##1}}{\end{SB@lgidx}}} % Čím to nahradíme
{}{\PackageError{zubuvzpevnik}{Patching \string\SB@makeauthorindex\space (large
	index layout) failed}{}}

% Patch the author index section heading to print the heading
\xpatchcmd{\SB@makeauthorindex}
{\renewenvironment{SB@lgidx}[1]{}{}} % Najde prázdnou definici
{% Nahradí ji vizuálním stylem (box s písmenem)
    \renewenvironment{SB@lgidx}[1]{%
        \hbox{\SB@colorbox\idxbgcolor{\vbox{%
                    \hbox to\idxheadwidth{{\idxheadfont\relax##1}\hfil}%
                }}}%
        \nobreak\vskip3\p@\@plus2\p@\@minus2\p@\nointerlineskip%
    }{\penalty-50\vskip5\p@\@plus5\p@\@minus4\p@}%
}
{}{\PackageError{zubuvzpevnik}{Patching \string\SB@makeauthorindex\space (author
	section headings) failed}{}}

% There are no longer just letters, so we need to make it wider than the original 1.5cm.
\setlength{\idxheadwidth}{0.7\linewidth}

\endinput
