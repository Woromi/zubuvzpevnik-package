\ProvidesFile{lokalizace.cfg}
% ==========================
% Localizace (jazyk písně, akordy podle jazyka, řazení rejstříku, uvozovky)
% ==========================
% Language selection, H/B note naming, filtering, index sort directive, quotes.
% Rationale for each: docs/internals.md#localisation-lokalizacecfg
\RequirePackage{xpatch}   % \patchcmd / \xpatchcmd

% ==========================
% Quotes ("uvozovky")
% ==========================
% Babel's quote marks spliced in as literal characters, not via csquotes.
\babelprovide[import]{czech}
\babelprovide[import]{english}
\providecommand\ZUB@fallbackquotes{“”‘’}
\def\ZUB@enquote#1#2#3#4\@nil#5{#1#5#2}% outer open #1, close #2; inner #3 #4; text #5
% # and & are switched before the argument is read, so \[C#m] survives inside a
% quote: songs activates them only while scanning a chord name, which is too
% late for text already tokenised. docs/internals.md#quotes
\DeclareRobustCommand\enquote{%
	\begingroup\catcode`\#\active\catcode`\&\active\ZUB@enquotearg}
\newcommand\ZUB@enquotearg[1]{%
	\endgroup% catcodes restored; #1 is tokenised by now
	\def\ZUB@q{}%
	\getlocaleproperty*\ZUB@q{\languagename}{characters/delimiters.quotes}%
	\ifdefempty\ZUB@q{\let\ZUB@q\ZUB@fallbackquotes}{}%
	\expandafter\ZUB@enquote\ZUB@q\@nil{#1}}
\let\uv\enquote% not \renewcommand: \uv must not read the argument itself

% ==========================
% Note-name conventions (English vs German/Czech)
% ==========================
% German/Czech needs an eighth note name (B = English B-flat) that songs has no
% room for, so the transposition scanner is patched on both the input and the
% output side. Why, and the naming table: docs/internals.md#note-names-the-eighth-note
\newcommand\ZUB@noteBb{\relax}% never matches a note name => disabled
\newcommand\ZUB@printBb{\printnoteB\noexpand\flt}

\patchcmd\SB@trtrans
	{\else-99 \fi}
	{\else\ifx\SB@temp\ZUB@noteBb\@ne\else-99 \fi\fi}
	{}{\PackageError{zubuvzpevnik}{Patching \string\SB@trtrans\space (note input) failed}{}}
\patchcmd\SB@trtrans
	{\printnoteB\noexpand\flt\or\printnoteB\or}
	{\ZUB@printBb\or\printnoteB\or}
	{}{\PackageError{zubuvzpevnik}{Patching \string\SB@trtrans\space (note output) failed}{}}

% An accidental is only folded into the note while transposing: with
% \SB@transposefactor at zero songs skips it (songs.sty:1891), since within one
% naming system it cannot change. Transliterating is the case where it can --
% the letter itself moves -- so an English \[B&], whose letter maps to H, came
% out as the nonexistent H\flt instead of German B. The shortcut is switched
% off, which lets the \flt/\shrp branches after it run as they do when
% transposing. Reading the accidental costs nothing when nothing else changes.
\patchcmd\SB@trnote
	{\ifnum\SB@transposefactor=\z@}
	{\iffalse}
	{}{\PackageError{zubuvzpevnik}{Patching \string\SB@trnote\space (accidental
		without transposition) failed}{}}

% Separate read/print tables let a song be read in one convention, printed in
% another. Reading (\ZUB@in...):
\newcommand\ZUB@inenglish{%
	\notenamesin{A}{B}{C}{D}{E}{F}{G}\def\ZUB@noteBb{\relax}%
}
\newcommand\ZUB@ingerman{%
	\notenamesin{A}{H}{C}{D}{E}{F}{G}\def\ZUB@noteBb{B}%
}
% Printing (\ZUB@out...): note-name table + the B-flat *output* spelling.
\newcommand\ZUB@outenglish{%
	\notenamesout{A}{B}{C}{D}{E}{F}{G}\def\ZUB@printBb{\printnoteB\noexpand\flt}%
}
\newcommand\ZUB@outgerman{%
	\notenamesout{A}{H}{C}{D}{E}{F}{G}\def\ZUB@printBb{B}%
}

% Read in #1, print in #2; matching conventions leave chords verbatim.
\newcommand\ZUB@chords[2]{%
	\ifthenelse{\equal{#1}{#2}}%
		{\csname ZUB@in#1\endcsname\csname ZUB@out#1\endcsname\SB@convertnotesfalse}%
		{\csname ZUB@in#1\endcsname\csname ZUB@out#2\endcsname}%
}

% Public combined switches (read and print in the same convention).
\newcommand\englishchords{\ZUB@chords{english}{english}}
\newcommand\germanchords{\ZUB@chords{german}{german}}
\let\czechchords\germanchords% Czech uses the German naming system

% ==========================
% Songbook-wide printed-chord override
% ==========================
% Force one printed convention book-wide; reading still follows each song.
\newcommand\ZUB@forcedout{}% empty => printed names follow the song language
\newcommand\useenglishchords{\renewcommand\ZUB@forcedout{english}}
\newcommand\usegermanchords{\renewcommand\ZUB@forcedout{german}}
\let\useczechchords\usegermanchords
\newcommand\useautochords{\renewcommand\ZUB@forcedout{}}

% Read in #1; print in the forced convention if set, else in #1.
\newcommand\ZUB@setchords[1]{%
	\ifdefempty{\ZUB@forcedout}%
		{\ZUB@chords{#1}{#1}}%
		{\ZUB@chords{#1}{\ZUB@forcedout}}%
}

% ==========================
% Songbook-wide accidental spelling
% ==========================
% songs picks sharps or flats per song, from the key it transposes into
% (\SB@setkeysig), and every \transpose hands the choice back to it
% (songs.sty:1811) -- which is why \prefersharps in a preamble does not outlive
% the first song. These pin one spelling for the whole book, as
% \useenglishchords pins one naming; \prefersharps and \preferflats pin one song
% the same way, and win over the book. docs/internals.md#accidental-spelling
\newcommand\ZUB@accidentals{}% empty => songs decides, per song
\newcommand\ZUB@songaccidentals{}% empty => no one-song exception

% Global, like songs' own \SB@setkeysig: a chord is set inside a group, and the
% choice has to outlive it. #1 is the pin to apply, empty for none.
\newcommand\ZUB@applypin[1]{%
	\ifdefempty{#1}{}{%
		\ifdefstring{#1}{sharps}
			{\global\SB@prefshrpstrue}{\global\SB@prefshrpsfalse}%
		\global\SB@needkeyfalse
	}%
}
\newcommand\ZUB@applyaccidentals{\ZUB@applypin\ZUB@accidentals}
\newcommand\usesharps{\renewcommand\ZUB@accidentals{sharps}\ZUB@applyaccidentals}
\newcommand\useflats{\renewcommand\ZUB@accidentals{flats}\ZUB@applyaccidentals}
\newcommand\useautoaccidentals{%
	\renewcommand\ZUB@accidentals{}\gdef\ZUB@songaccidentals{}%
	\global\SB@needkeytrue}

% songs' own \prefersharps/\preferflats only set the flags, so a \transpose
% below them takes the choice back. Recording it makes it last the song out,
% wherever in the song it stands.
\newcommand\ZUB@pinsong[1]{\gdef\ZUB@songaccidentals{#1}\ZUB@applypin\ZUB@songaccidentals}
\renewcommand\prefersharps{\ZUB@pinsong{sharps}}
\renewcommand\preferflats{\ZUB@pinsong{flats}}

% Re-assert per song, for the songs that never transpose: \SB@setkeysig is only
% consulted when there is a transposition, so nothing else would set it there.
% Each song starts without an exception of its own.
\g@addto@macro\SB@@@beginsong{\gdef\ZUB@songaccidentals{}\ZUB@applyaccidentals}

% ...and where it is consulted, keep it from overriding a pinned choice.
\let\ZUB@setkeysig\SB@setkeysig
\renewcommand\SB@setkeysig{%
	\ifdefempty{\ZUB@songaccidentals}%
		{\ifdefempty{\ZUB@accidentals}{\ZUB@setkeysig}{\ZUB@applyaccidentals}}%
		{\ZUB@applypin\ZUB@songaccidentals}%
}

% ==========================
% The \lang song key: selects babel language and chord naming
% ==========================
% lang={czech, quenya}: the first is the song's language, the rest only tag it;
% docs/internals.md#several-languages
\newcommand{\SB@songlang}{}
\newcommand{\SB@songlangs}{}
\def\ZUB@firstlang#1,#2\@nil{#1}
\newsongkey{lang}
{\gdef\SB@songlang{}\gdef\SB@songlangs{}\selectlanguage{english}\ZUB@setchords{english}}%
{\xdef\SB@songlangs{\zap@space#1 \@empty}%
	\xdef\SB@songlang{\expandafter\ZUB@firstlang\SB@songlangs,\@nil}%
	\selectlanguage{\SB@songlang}%
	\ifthenelse{\equal{\SB@songlang}{czech}\OR\equal{\SB@songlang}{slovak}}%
		{\ZUB@setchords{german}}{\ZUB@setchords{english}}%
}

% ==========================
% Per-language index directive
% ==========================
% A "%lang <language>" line before each song's index entries lets songidx.lua
% apply per-language title rules. \@percentchar reaches the file as a literal %.
\xpatchcmd{\SB@addtoindex}
	{\SB@cwrite{#1}{#2}}
	{\SB@cwrite{#1}{\@percentchar lang \SB@songlang}\SB@cwrite{#1}{#2}}
	{}{\PackageError{zubuvzpevnik}{Patching \string\SB@addtoindex\space (lang directive) failed}{}}

% ==========================
% Filter songs by language
% ==========================
% A filtered song's box is voided, which also drops its (deferred) index writes.
% No lang = kept by exclude, dropped by include: docs/internals.md#language-filtering
% \providecommand: build.sh may have already defined these on the command line
\providecommand\ZUB@includelangs{}
\providecommand\ZUB@excludelangs{}

\newcommand\includelangs[1]{\renewcommand\ZUB@includelangs{#1}}
\newcommand\excludelangs[1]{\renewcommand\ZUB@excludelangs{#1}}

\let\SB@origsubmitsong\SB@submitsong
\newcommand\ZUB@dropsong{\setbox\SB@songbox\box\voidb@x\addtocounter{songnum}{-1}}
% With both lists empty, \IfSubStr on the empty exclude list keeps every song.
\renewcommand\SB@submitsong{%
  \ifdefempty{\ZUB@includelangs}%
    {\IfSubStr{\ZUB@excludelangs}{\SB@songlang}\ZUB@dropsong\SB@origsubmitsong}%
    {\IfSubStr{\ZUB@includelangs}{\SB@songlang}\SB@origsubmitsong\ZUB@dropsong}%
}

\endinput
