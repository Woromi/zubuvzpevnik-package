\ProvidesFile{metadata.cfg}
% ==========================
% Song metadata keys and prelude layout
% ==========================
% Optional song keys, laid out beside the title on large paper.
\newcommand{\key}{}
\newsongkey{key}{\def\key{}}{\def\key{\small \bfseries{Key}: {\mdseries#1}\par}}

\newcommand{\tuning}{}
\newsongkey{tun}{\def\tuning{}}{\def\tuning{\small \bfseries{Tuning}: {\mdseries#1}\par}}

\newcommand{\tempo}{}
\newsongkey{tem}{\def\tempo{}}{\def\tempo{\small \bfseries{Tempo}: {\mdseries#1}\par}}

\newcommand{\original}{}
\newsongkey{ori}{\def\original{}}{\def\original{\small \bfseries{Original}: {\mdseries#1}\par}}

\newcommand{\usedchords}{}
\newsongkey{chr}{\def\usedchords{}}{\def\usedchords{#1\par}}

\newcommand{\sourcelink}{}
\newsongkey{src}{\def\sourcelink{}}{\def\sourcelink{\url{#1}\par}}

% ==========================
% Paper fit
% ==========================
% Comma-separated paper sizes the song is known to fit, e.g. pap={a4,a5}; a
% size written with the x2 suffix (pap={a4,a5x2}) fits two facing pages of it
% rather than one. Prints nothing. No key means no size has been measured to
% fit, which warns on every paper -- see docs/tools.md.
\newcommand{\paperfits}{}
\newsongkey{pap}{\def\paperfits{}}{\def\paperfits{#1}}

% \zap@space wants a real space token before \@empty, which a space typed after
% a control word is not, so the list goes through an argument to get one.
\newcommand{\zub@stripspaces}[1]{\zap@space#1 \@empty}

% Warns once per song whose pap key does not list the paper being typeset.
\newif\ifzub@paperfound
\newcommand{\zub@checkpaperfit}{%
	\ifzub@paperknown
		\zub@paperfoundfalse
		% \edef throughout: \@for assigns with \def, so an \ifx against a \long
		% macro (anything \newcommand made) would never match.
		\edef\zub@thispaper{\zub@papername}%
		% A song on two facing pages of this paper fits the book just as well.
		\edef\zub@thisspread{\zub@papername x2}%
		\edef\zub@paplist{\paperfits}%
		\edef\zub@paplist{\expandafter\zub@stripspaces\expandafter{\zub@paplist}}%
		\@for\zub@paper:=\zub@paplist\do{%
			\edef\zub@paper{\zub@paper}%
			\ifx\zub@paper\zub@thispaper\zub@paperfoundtrue\fi%
			\ifx\zub@paper\zub@thisspread\zub@paperfoundtrue\fi%
		}%
		\ifzub@paperfound\else
			% \@empty and \zub@paplist are both plain \def, so \ifx can compare them.
			\ifx\zub@paplist\@empty
				\def\zub@papsays{it has no pap key}%
			\else
				\def\zub@papsays{its pap key says '\zub@paplist'}%
			\fi
			\PackageWarning{zubuvzpevnik}{Song '\songtitle' is not marked as fitting
				\zub@papername\space paper; \zub@papsays. Check whether it typesets on
				one page, or on two facing ones, and record the answer in pap}%
		\fi
	\fi
}

% Chord diagrams collected per song, for a book whose page has no room to show
% them beside the title. See docs/internals.md#collected-chord-diagrams.
\newcommand{\ZUB@chordlist}{}
\newcommand{\ZUB@chr@pending}{}
\newcommand{\ZUB@chordentry}[2]{}

% Stashed inside the song, where \songtitle is the song's own.
\newcommand{\ZUB@chr@stash}{%
	\ifdefempty{\usedchords}{\gdef\ZUB@chr@pending{}}{%
		\begingroup
		\edef\ZUB@chr@tmp{\endgroup
			\gdef\noexpand\ZUB@chr@pending{%
				\noexpand\ZUB@chordentry
				{\unexpanded\expandafter{\songtitle}}%
				{\unexpanded\expandafter{\usedchords}}}}%
		\ZUB@chr@tmp
	}%
}

% Flushed where the language filter has already decided to keep the song.
\let\ZUB@chr@submit\SB@origsubmitsong
\renewcommand{\SB@origsubmitsong}{%
	\expandafter\gappto\expandafter\ZUB@chordlist\expandafter{\ZUB@chr@pending}%
	\gdef\ZUB@chr@pending{}%
	\ZUB@chr@submit
}

% A fraction, not a length: the class loads geometry after this package, so
% \linewidth is only the real text width at use time.
\newcommand{\ZUB@chr@namefrac}{0.33}
\newlength{\ZUB@chr@namewidth}

% Inside a songs environment the songs are queued and shipped by \end{songs},
% so plain material typeset there lands ahead of them and a \clearpage breaks
% the queue apart. songs.sty's intersong* is the sanctioned way in: it hands the
% content to the same pipeline as a song, on its own page.
\newcommand{\ZUB@chr@ownpage}[1]{%
	\ifSB@songsenv
		\begin{intersong*}#1\end{intersong*}%
	\else
		\clearpage #1%
	\fi
}

% The list is filled as songs are typeset, so a chart can only show the songs
% that came before it.
\newcommand{\ZUB@chr@empty}{%
	\PackageWarning{zubuvzpevnik}{No chord diagrams collected, so nothing is
		printed. The list is built as the songs are typeset, so this command has
		to come after the songs it should chart -- no song before it declares a
		chr key}%
}

\newcommand{\insertusedchords}[1][P\v rehled akord\r u]{%
	\ifchorded
		\ifdefempty{\ZUB@chordlist}{\ZUB@chr@empty}{%
			\ZUB@chr@ownpage{%
			{\centering\large\bfseries #1\par}\vspace{\baselineskip}
			\begingroup
			% One row per song: title left, its diagrams right. Rows are ordinary
			% paragraphs, so a long list breaks across pages by itself.
			\parindent\z@ \parskip\z@
			\setlength{\ZUB@chr@namewidth}{\ZUB@chr@namefrac\linewidth}%
			% \vspace{0pt} first makes \parbox[t] align box tops rather than first
			% baselines, which is what puts the title level with the chord names.
			\renewcommand{\ZUB@chordentry}[2]{%
				\par\addvspace{2\p@}\noindent
				\parbox[t]{\ZUB@chr@namewidth}%
					{\vspace{\z@}\raggedright\small\bfseries ##1}%
				\parbox[t]{\dimexpr\linewidth-\ZUB@chr@namewidth\relax}%
					{\vspace{\z@}\raggedright\def\par{}##2}%
				\par}%
			\ZUB@chordlist
			\endgroup
			}%
		}%
	\fi
}

% A merged chart: every diagram in the book once, sorted, with no song titles.
% Sorting is done in Lua -- the package is LuaLaTeX-only anyway -- on a key that
% folds \shrp and \flt down to # and b. See docs/internals.md.
\directlua{
  local sty = kpse.find_file("zubuvzpevnik.sty")
  if sty then dofile(sty:match("(.*/)") .. "lua/akordy.lua") end
}

\newcommand{\ZUB@chr@record}[2]{%
	\edef\ZUB@chr@tmp{\detokenize{#1}}%
	\edef\ZUB@chr@tmpii{\detokenize{#2}}%
	\directlua{zubchr.add("\luaescapestring{\ZUB@chr@tmp}",
		"\luaescapestring{\ZUB@chr@tmpii}")}%
}

\newcommand{\insertallchords}[1][P\v rehled akord\r u]{%
	\ifchorded
		\ifdefempty{\ZUB@chordlist}{\ZUB@chr@empty}{%
			\begingroup
			% Replay the stored list with \gtab recording instead of drawing.
			\renewcommand{\ZUB@chordentry}[2]{{\def\par{}\let\gtab\ZUB@chr@record##2}}%
			\ZUB@chordlist
			\endgroup
			\ZUB@chr@ownpage{%
			{\centering\large\bfseries #1\par}\vspace{.5\baselineskip}
			\begingroup
			\parindent\z@ \parskip\z@ \centering
			\baselineskip\z@skip \lineskip 6\p@ \lineskiplimit 6\p@
			\directlua{zubchr.emit()}%
			\par
			\endgroup
			}%
		}%
	\fi
}

\renewcommand{\extendprelude}{{%
			\usedchords
			\showrefs
			\original
			\tuning
			\tempo
%			\key
		}}

\renewcommand\makeprelude{%
	\zub@checkpaperfit
	\resettitles
	\ZUB@chr@stash
	{\Large\bfseries\songtitle\space\mdseries\smalleronsmallpage[1](\songauthors)}%
	\iflargepaper
		\hfill
		\raisebox{0pt}[0pt][0pt]{%
			\makebox[0pt][r]{% Box nulové šířky zarovnaný doprava
				\parbox[t]{7cm}{% Box s textem
					\raggedleft % Zarovnání textu uvnitř boxu doprava
					\extendprelude % Metadata
				}%
			}%
		}%
	\fi
}

\endinput
