\ProvidesFile{akordy.cfg}
% ==========================
% Chord display (capo, chord-diagram appearance)
% ==========================
% Generic chord look only; note naming (H/B) lives in lokalizace.cfg.
\RequirePackage{xpatch}   % \patchcmd

% Capo: transpose if \transcapos is set, otherwise print a "Capo n" note.
\renewcommand\capo[1]{%
	\iftranscapos
		\transpose{#1}%
	\else
		\vspace{-1em}\musicnote{\textit{Capo #1}}%
	\fi
}

% Chord diagrams: mono barre-position font, and reserve height above empty frets.
\patchcmd{\SB@fretnum}
{\sffamily\fontsize\@xpt\@xpt\selectfont#1}
{\ttfamily\small#1}{}{}

\patchcmd{\SB@topempty}
{\relax}
{{\vrule\@width\z@\@height4.3333\p@\@depth.8333\p@}}{}{}

\endinput
