\ProvidesFile{akordy.cfg}
% ==========================
% Chord display (capo, chord-diagram appearance)
% ==========================
% Generic chord look only; note naming (H/B) lives in lokalizace.cfg.
\RequirePackage{xpatch}   % \patchcmd

% Capo: transpose if \transcapos is set, otherwise print a "Capo n" note.
% \zub@tr@capnow keeps the fret the shapes were moved from, for the scores
% (transpozice.cfg).
\newcommand\zub@tr@capnow{0}
\renewcommand\capo[1]{%
	\iftranscapos
		\transpose{#1}%
		\xdef\zub@tr@capnow{\number\numexpr#1\relax}%
	\else
		\vspace{-1em}\musicnote{\textit{Capo #1}}%
	\fi
}

% "No chord": spelled out, \[N.C.] has its C read as a note and transposed. The
% transposition scanner copies a macro token through. docs/internals.md#no-chord
\newcommand\nochord{N.C.}

% Multiword chords on by default; \SinglewordChords turns them off for one song.
% docs/internals.md#multiword-chords
\MultiwordChords
\newcommand\SinglewordChords{\def\SB@spcinit{}}

% Chord diagrams: mono barre-position font, and reserve height above empty frets.
\patchcmd{\SB@fretnum}
{\sffamily\fontsize\@xpt\@xpt\selectfont#1}
{\ttfamily\small#1}
{}{\PackageError{zubuvzpevnik}{Patching \string\SB@fretnum\space (barre number
	font) failed}{}}

\patchcmd{\SB@topempty}
{\relax}
{{\vrule\@width\z@\@height4.3333\p@\@depth.8333\p@}}
{}{\PackageError{zubuvzpevnik}{Patching \string\SB@topempty\space (height above
	empty frets) failed}{}}

\endinput
