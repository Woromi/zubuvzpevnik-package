\ProvidesFile{transpozice.cfg}
% ==========================
% Per-book song transposition
% ==========================
% \transposesong[key=K]{N} in a book, above a song's \input: the next song
% sounds N semitones higher, its chords re-shaped by songs' \transpose.
% See docs/internals.md#per-book-transposition.
\RequirePackage{xpatch}
\zub@loadlua{transpozice}

% Pending for the next \beginsong (global: a book line sits between songs).
\newcommand\zub@tr@next{0}
\newcommand\zub@tr@nextkey{}
% The current song's (global, so the prelude at \endsong still sees them).
\newcommand\zub@tr@shape{0}% semitones the chords are re-shaped by
\newcommand\zub@tr@key{}% key= of the book line, for \key
\newif\ifzub@tr@pinned% the book's spelling overrides the song's own pin

\define@key{zubtr}{key}{\gdef\zub@tr@nextkey{#1}}

\newcommand\transposesong[2][]{%
	\ifnum\zub@tr@next=\z@\else
		\PackageWarning{zubuvzpevnik}{\string\transposesong{\zub@tr@next}
			never reached a song: another \string\transposesong\space replaces it}%
	\fi
	\gdef\zub@tr@nextkey{}%
	\setkeys{zubtr}{#1}%
	\ifnum#2<-11 \zub@tr@range{#2}\else\ifnum#2>11 \zub@tr@range{#2}\else
		\xdef\zub@tr@next{\number\numexpr#2\relax}%
	\fi\fi
}
\newcommand\zub@tr@range[1]{%
	\PackageError{zubuvzpevnik}{\string\transposesong{#1}: the shift must be
		-11 to 11}{The song is left untransposed.}%
	\gdef\zub@tr@next{0}%
}

% Song start, inside the song box, after songs' own reset of the transposition.
\newcommand\zub@tr@beginsong{%
	\global\let\zub@tr@shape\zub@tr@next\global\zub@tr@pinnedfalse
	\ifnum\zub@tr@shape=\z@
		\global\let\zub@tr@key\@empty
	\else
		\global\let\zub@tr@key\zub@tr@nextkey
		\transpose{\zub@tr@shape}%
	\fi
	% Every song: under transposecapos its scores move by the capo too.
	\edef\zub@tr@pin{\directlua{tex.sprint(zubtr.song{
			n = \zub@tr@shape,
			key = "\luaescapestring{\detokenize\expandafter{\zub@raw@key}}",
			bookkey = "\luaescapestring{\detokenize\expandafter{\zub@tr@key}}",
			tun = "\luaescapestring{\detokenize\expandafter{\zub@raw@tun}}",
			cap = "\luaescapestring{\zub@capnum}",
			german = \ifx\ZUB@noteBb\zub@tr@B true\else false\fi,
			transcapos = \iftranscapos true\else false\fi})}}%
	\ifx\zub@tr@pin\@empty\else
		\expandafter\zub@tr@pinsong\expandafter{\zub@tr@pin}\global\zub@tr@pinnedtrue
	\fi
	\gdef\zub@tr@next{0}\gdef\zub@tr@nextkey{}%
}
\def\zub@tr@B{B}% \def: \ifx-compared with lokalizace.cfg's \ZUB@noteBb
\g@addto@macro\SB@@@beginsong{\zub@tr@beginsong}
% The cap key's \capo runs before that hook, so the reset goes first.
\preto\SB@@@beginsong{\gdef\zub@tr@capnow{0}}

% Semitones the current shapes sit from the written ones: the book's
% re-shaping, plus the capo under transposecapos.
\newcommand\zub@tr@shift{\number\numexpr\zub@tr@shape+\zub@tr@capnow\relax}

% key= is a pin of the song's own, like \prefersharps, and outranks one.
\let\zub@tr@pinsong\ZUB@pinsong
\renewcommand\ZUB@pinsong[1]{\ifzub@tr@pinned\else\zub@tr@pinsong{#1}\fi}

% Prelude, typeset at \endsong: chr diagrams of moved shapes finger the old
% ones, so they are left out (and out of the collected charts); key= is the
% key the song now sounds in.
\newcommand\zub@tr@prelude{%
	\ifnum\zub@tr@shift=\z@\else\let\usedchords\@empty\fi
	\ifdefempty\zub@tr@key{}{\def\key{\zub@labelled{Key}{\zub@tr@key}}}
}
\xpretocmd\makeprelude{\zub@tr@prelude}{}{\PackageError{zubuvzpevnik}{Patching
	\string\makeprelude\space (\string\transposesong) failed}{}}

% Score of the current song: lyluatex options that transpose it with the
% chords, empty when they stay. See lua/transpozice.lua.
\newcommand\zub@tr@lyopts[1]{%
	\edef\zub@tr@tmp{\directlua{tex.sprint(zubtr.lyopts("\luaescapestring{#1}", \zub@tr@shift))}}%
	\ifx\zub@tr@tmp\@empty\else
		\ifx\zub@lyopts\@empty
			\let\zub@lyopts\zub@tr@tmp
		\else
			\edef\zub@lyopts{\zub@lyopts,\zub@tr@tmp}%
		\fi
	\fi
}

\endinput
