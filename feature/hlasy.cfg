\ProvidesFile{hlasy.cfg}
%% ==========================

\newif\ifmultivoice
\multivoicetrue

\newcommand{\multivoiceon}{\multivoicetrue}
\newcommand{\multivoiceoff}{\multivoicefalse}

\newcommand{\rolestyle}{\setmainfont{Alegreya Sans} \textsc}
\newcommand{\secondvoicestyle}{\color{darkgray}\small}

% How far the second voice is tucked up toward the main line (0pt = a full
% small line below it). Tune to taste; too large overlaps the main descenders.
\newlength{\secondvoiceraise}
\setlength{\secondvoiceraise}{2pt}

\newcommand{\multivoice}[2]{%
  \ifmultivoice
    \leavevmode%
    \vtop{%
      \offinterlineskip%
      \hbox{\strut #1}%
      % \strut goes inside \secondvoicestyle so it shrinks with the smaller
      % font; the negative kern then tucks the second voice up against the main
      % line (it sits a bit lower than its small size needs otherwise).
      \kern-\secondvoiceraise
      \hbox{\secondvoicestyle{\strut #2}}%
    }%
  \else
    #1%
  \fi
}

\NewDocumentCommand{\role}{m g}{%
  \nobreak\hfill
  \vtop{%
    \offinterlineskip
    \IfNoValueTF{#2}{
      \hbox{\small\strut \rolestyle{#1}}%
    }{
      \hbox{\small\strut \rolestyle{#1}}%
      \ifmultivoice
        \hbox{\small\strut \rolestyle{\secondvoicestyle{#2}}}
      \else\fi
    }
  }%
}