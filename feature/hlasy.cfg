\ProvidesFile{hlasy.cfg}
% ==========================
% Multi-voice: a second voice under a lyric line, and role labels
% ==========================
% Rationale: docs/internals.md#multi-voice-hlasycfg

\newif\ifmultivoice
\multivoicetrue

% Inline mode: second voice after the main text, "(second)", no stacking.
\newif\ifzub@mvinline
\newcommand{\multivoiceon}{\multivoicetrue\zub@mvinlinefalse}
\newcommand{\multivoiceoff}{\multivoicefalse\zub@mvinlinefalse}
\newcommand{\multivoiceinline}{\multivoicefalse\zub@mvinlinetrue}

% A family defined once; \setmainfont here would re-read the font per label.
\newfontfamily\zub@rolefont{Alegreya Sans}
\newcommand{\rolestyle}{\zub@rolefont\textsc}
\newcommand{\secondvoicestyle}{\color{darkgray}\small}

% Tuck of the second voice under the main line; too large overlaps descenders.
\newlength{\secondvoiceraise}
\setlength{\secondvoiceraise}{2pt}

\newcommand{\multivoice}[2]{%
  \ifmultivoice
    \leavevmode%
    \vtop{%
      \offinterlineskip%
      \hbox{\strut #1}%
      % \strut inside \secondvoicestyle so it shrinks with the font
      \kern-\secondvoiceraise
      \hbox{\secondvoicestyle{\strut #2}}%
    }%
  \else\ifzub@mvinline
    #1\zub@mvparen{#2}%
  \else
    #1%
  \fi\fi
}

% Marks the parens so lua/hlasy.lua can merge "(a)(b)" split across chords.
\newattribute\zub@mvattr
\directlua{
  local sty = kpse.find_file("zubuvzpevnik.sty")
  if sty then dofile(sty:match("(.*/)") .. "lua/hlasy.lua") end
}
\newcommand{\zub@mvparen}[1]{%
  \if\relax\detokenize{#1}\relax\else
    % After text, a chord's box, its penalty or a colour whatsit.
    \ifcase\numexpr\lastnodetype+1\relax\or\zub@mvspace\or\zub@mvspace
      \or\zub@mvspace\or\or\or\or\or\or\or\zub@mvspace\or\or\or\or\zub@mvspace
    \fi
    {\secondvoicestyle{\zub@mvattr=1 (}\ignorespaces#1%
      \ifdim\lastskip>0pt \unskip\global\zub@mvtrailtrue\else\global\zub@mvtrailfalse\fi
      {\zub@mvattr=2 )}}%
    \ifzub@mvtrail\space\fi
  \fi
}
\newif\ifzub@mvtrail
\newcommand{\zub@mvspace}{{\zub@mvattr=3 \space}}

\NewDocumentCommand{\role}{m g}{%
  \nobreak\hfill
  \vtop{%
    \offinterlineskip
    \IfNoValueTF{#2}{
      \hbox{\small\strut \rolestyle{#1}}%
    }{
      \ifzub@mvinline
        \hbox{\small\strut \rolestyle{#1}%
          \if\relax\detokenize{#1}\relax\else\space\fi
          \rolestyle{\secondvoicestyle{(#2)}}}%
      \else
        \hbox{\small\strut \rolestyle{#1}}%
        \ifmultivoice
          \hbox{\small\strut \rolestyle{\secondvoicestyle{#2}}}
        \else\fi
      \fi
    }
  }%
}

\endinput
