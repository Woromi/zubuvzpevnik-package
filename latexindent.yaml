# latexindent config for song files: \[...] is a chord rather than display math,
# and \beginX ... \endX song parts are indentable blocks (the pattern excludes
# real \begin{...} environments and \beginsong). Wiring it into an editor:
# docs/building.md#editing-song-files
defaultIndent: '    '
specialBeginEnd:
    displayMath:
        lookForThis: 0
    SongPart:
        begin: '\\begin(?!\{)(?!song\b)[a-zA-Z]+\*?'
        end:   '\\end(?!\{)(?!song\b)[a-zA-Z]+\*?'
        lookForThis: 1
